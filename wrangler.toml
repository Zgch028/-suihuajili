# Cloudflare Pages 项目配置
# 说明：本文件给 `wrangler` 指明项目名称与构建产物目录。
# account_id 也可不写，改为在 CI / 本地用环境变量 CLOUDFLARE_ACCOUNT_ID 传入。

name = "suihuajili"
pages_build_output_dir = "dist"
compatibility_date = "2026-08-28"

# 若不想用 GitHub Secret，可把账号 ID 直接填在这里（注意别提交真实 token）：
# account_id = "YOUR_CLOUDFLARE_ACCOUNT_ID"
