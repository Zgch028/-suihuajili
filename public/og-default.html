<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1200px;height:630px;}
  .og{position:relative;width:1200px;height:630px;background:url('posters/bg-shanhui.png') center/cover no-repeat;
    font-family:"Microsoft YaHei","微软雅黑",sans-serif;color:#fff;overflow:hidden;}
  .overlay{position:absolute;inset:0;background:linear-gradient(90deg, rgba(6,18,26,.72) 0%, rgba(6,18,26,.32) 55%, rgba(6,18,26,.1) 100%);}
  .content{position:absolute;inset:0;padding:70px 80px;display:flex;flex-direction:column;}
  .eyebrow{font-size:20px;letter-spacing:6px;color:#e9c46a;font-weight:600;}
  .title{font-family:"KaiTi","STKaiti","楷体",serif;font-size:110px;font-weight:700;
    letter-spacing:8px;margin-top:16px;text-shadow:0 5px 18px rgba(0,0,0,.5);}
  .divider{width:120px;height:4px;background:#e9c46a;margin:22px 0 22px;border-radius:2px;}
  .tagline{font-size:34px;font-weight:600;letter-spacing:2px;}
  .url{font-size:24px;letter-spacing:1px;color:#e9c46a;margin-top:auto;font-weight:700;}
</style>
</head>
<body>
<div class="og">
  <div class="overlay"></div>
  <div class="content">
    <div class="eyebrow">岁 华 纪 丽 · 文 化 基 因</div>
    <div class="title">岁华纪丽</div>
    <div class="divider"></div>
    <div class="tagline">一份记录历史温情的笔记 · 让历史照亮现代生活</div>
    <div class="url">suihuajili.cn</div>
  </div>
</div>
</body>
</html>
