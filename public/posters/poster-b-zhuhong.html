<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1080px;height:1350px;}
  .poster{position:relative;width:1080px;height:1350px;background:url('bg-zhuhong.png') center/cover no-repeat;
    font-family:"Microsoft YaHei","微软雅黑",sans-serif;color:#f7e9c8;overflow:hidden;}
  .overlay{position:absolute;inset:0;
    background:radial-gradient(120% 80% at 50% 38%, rgba(120,12,12,.18) 0%, rgba(80,6,6,.42) 100%);}
  .frame{position:absolute;inset:46px;border:2px solid rgba(231,196,106,.55);border-radius:6px;}
  .frame::before,.frame::after{content:"";position:absolute;width:26px;height:26px;border:3px solid #e9c46a;}
  .frame::before{top:-3px;left:-3px;border-right:none;border-bottom:none;}
  .frame::after{bottom:-3px;right:-3px;border-left:none;border-top:none;}
  .content{position:absolute;inset:0;padding:104px 92px;display:flex;flex-direction:column;align-items:center;text-align:center;}
  .eyebrow{font-size:24px;letter-spacing:12px;color:#e9c46a;font-weight:600;}
  .title{font-family:"KaiTi","STKaiti","楷体",serif;font-size:138px;font-weight:700;
    letter-spacing:14px;margin-top:24px;color:#f6d98a;text-shadow:0 4px 16px rgba(60,4,4,.6);}
  .divider{width:150px;height:3px;background:linear-gradient(90deg,transparent,#e9c46a,transparent);margin:34px 0 30px;}
  .tagline{font-size:38px;font-weight:700;letter-spacing:4px;color:#fceccb;text-shadow:0 3px 12px rgba(80,4,4,.55);}
  .proposal{font-size:27px;line-height:1.8;margin-top:24px;color:#f3e2c0;max-width:720px;text-shadow:0 2px 10px rgba(80,4,4,.5);}
  .foot{margin-top:auto;display:flex;flex-direction:column;align-items:center;}
  .motto{font-family:"KaiTi","楷体",serif;font-size:33px;line-height:1.7;color:#f8eccb;letter-spacing:2px;text-shadow:0 3px 12px rgba(80,4,4,.55);}
  .row{margin-top:30px;display:flex;align-items:center;gap:26px;}
  .url{font-size:28px;letter-spacing:3px;color:#f6d98a;font-weight:700;}
  .qr{width:150px;height:150px;border:5px solid #f6d98a;border-radius:12px;background:#fff;
    box-shadow:0 8px 22px rgba(40,2,2,.5);}
</style>
</head>
<body>
<div class="poster">
  <div class="overlay"></div>
  <div class="frame"></div>
  <div class="content">
    <div class="eyebrow">岁 华 纪 丽 · 文 化 基 因</div>
    <div class="title">岁华纪丽</div>
    <div class="divider"></div>
    <div class="tagline">一份记录历史温情的笔记</div>
    <div class="proposal">为今人做一份"纪丽"的生活提案，<br>让历史照亮现代生活。</div>
    <div class="foot">
      <div class="motto">岁华纪丽，记岁时之美好，存历史之温度。</div>
      <div class="row">
        <span class="url">suihuajili.cn</span>
        <img class="qr" src="qr.png" alt="QR">
      </div>
    </div>
  </div>
</div>
</body>
</html>
